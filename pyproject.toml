[project]
name = "nih-chestxray14-pytorch"
version = "0.1.0"
description = "PyTorch project for multi-label thoracic disease classification using the NIH ChestX-ray14 dataset."
readme = "README.md"
authors = [
    { name = "David Simms", email = "davesimms44@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydicom>=3.0.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
