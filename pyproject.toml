[project]
name = "vindr-cxr-pytorch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Simms", email = "davesimms44@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydicom>=3.0.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
vindr-cxr-pytorch = "vindr_cxr_pytorch:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
